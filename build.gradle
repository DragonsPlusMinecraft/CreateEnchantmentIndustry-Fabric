plugins {
    id 'fabric-loom' version '1.10.5'
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_artifact_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDir 'src/integration/apothic_enchanting/java'
            srcDir 'src/integration/apotheosis/java'
        }
        resources {
            srcDir 'src/generated/resources'
            srcDir 'src/integration/apothic_enchanting/resources'
            srcDir 'src/integration/apotheosis/resources'
            exclude '.cache/'
        }
    }
}

def datagenExistingResources = layout.buildDirectory.dir('datagen-existing-resources')
def prepareDatagenExistingResources = tasks.register('prepareDatagenExistingResources', Sync) {
    from 'src/main/resources'
    from 'src/integration/apothic_enchanting/resources'
    from 'src/integration/apotheosis/resources'
    into datagenExistingResources
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run/server'
            programArg '--nogui'
        }
        datagen {
            client()
            name 'Data Generation'
            runDir 'run/datagen'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dporting_lib.datagen.existing_resources=${datagenExistingResources.get().asFile}"
            vmArg "-Dcreate_dragons_plus.datagen.translations=${file('src/main/translations')}"
        }
        configureEach {
            vmArg '-XX:+AllowEnhancedClassRedefinition'
            vmArg '-XX:+IgnoreUnrecognizedVMOptions'
        }
    }
}

tasks.named('runDatagen').configure {
    dependsOn prepareDatagenExistingResources
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://mvn.devos.one/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.fallenbreath.me/releases' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.terraformersmc.com' }
    maven { url = 'https://maven.bai.lol' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.dragons.plus/releases' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings {
            nameSyntheticMembers = false
        }
        parchment "org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip"
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "com.simibubi.create:create-fabric:${create_fabric_version}"
    modImplementation "maven.modrinth:create-dragons-plus:${create_dragons_plus_version}"

    implementation "io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    modImplementation(include("me.fallenbreath:conditional-mixin-fabric:${conditional_mixin_version}"))

    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") {
        transitive = false
    }
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") {
        transitive = false
    }

    modCompileOnly("maven.modrinth:zenith:${zenith_version}") {
        transitive = false
    }
    modCompileOnly "maven.modrinth:fakerlib:${fakerlib_version}"
    modCompileOnly "maven.modrinth:zenith-attributes:${zenith_attributes_version}"
    modLocalRuntime("maven.modrinth:zenith:${zenith_version}") {
        transitive = false
    }
    modLocalRuntime "maven.modrinth:fakerlib:${fakerlib_version}"
    modLocalRuntime "maven.modrinth:zenith-attributes:${zenith_attributes_version}"
    // Zenith's guide-book recipes and loot tables are enabled when its suggested Patchouli mod is present.
    modLocalRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
    // Loom's development classpath does not expand every jar-in-jar from Zenith Attributes.
    modLocalRuntime "maven.modrinth:6oFu5eHi:${additional_entity_attributes_version}"
    modLocalRuntime "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modLocalRuntime "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    modLocalRuntime "io.github.ladysnake:PlayerAbilityLib:${player_ability_lib_version}"
    modLocalRuntime "io.github.fabricators_of_create.Porting-Lib:loot:${porting_lib_version}"
    modLocalRuntime "com.github.Chocohead:Fabric-ASM:${fabric_asm_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version          : minecraft_version,
            fabric_loader_version      : fabric_loader_version,
            fabric_api_version         : fabric_api_version,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            mod_github                 : mod_github,
            create_version_range       : create_version_range,
            create_dragons_plus_version: create_dragons_plus_mod_version,
            jei_version                : jei_version,
            zenith_version             : zenith_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    from 'LICENSE.txt'
    exclude '.cache'
}

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile 'codeformat/formatter-config.xml'
        licenseHeaderFile 'codeformat/HEADER.txt'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_artifact_id}-fabric-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'DragonsPlus'
            url = 'https://maven.dragons.plus/releases'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from remapSourcesJar.archiveFile
    changelog = project.file('CHANGELOG.md').text
    version = mod_version
    type = BETA
    displayName = "CEI ${mod_version} for Create Fabric ${minecraft_version}-${create_version_production}"
    modLoaders.add('fabric')

    curseforge {
        projectId = '688768'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('fabric-api', 'create-fabric', 'create-dragons-plus')
        optional('jei', 'zenith')
        client = true
        server = true
    }

    modrinth {
        projectId = 'JWGBpFUP'
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('fabric-api', 'create-fabric', 'create-dragons-plus')
        optional('jei', 'zenith')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

idea {
    project {
        jdkName = '17'
        languageLevel = JavaVersion.VERSION_17
    }
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
